<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badminton Standings Pro</title>
    <!-- Tailwind CSS & Font Modern -->
    <script src="https://jsdelivr.net"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        /* Kustomisasi scrollbar halus untuk list absen */
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-zinc-50 min-h-screen text-zinc-900 pb-12 antialiased">

    <!-- Sticky Mini Header untuk Mobile -->
    <header class="bg-white border-b border-zinc-200/80 sticky top-0 z-50 px-4 py-3 shadow-xs backdrop-blur-md bg-white/90">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div>
                <h1 class="text-base font-extrabold tracking-tight text-zinc-900 flex items-center gap-1.5">
                    <span>🏸</span> MABAR KLASEMEN
                </h1>
                <p class="text-[10px] text-zinc-500 font-medium tracking-wide uppercase">Ganda Perorangan</p>
            </div>
            <span id="activeCountBadge" class="bg-zinc-950 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow-xs">
                0 Pemain
            </span>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 mt-4 space-y-5">

        <!-- 1. TOMBOL UTAMA KOCOK PERTANDINGAN -->
        <div class="bg-white border border-zinc-200/60 rounded-2xl p-4 shadow-xs text-center space-y-3">
            <div class="p-3 bg-zinc-50 rounded-xl border border-dashed border-zinc-300">
                <span class="text-2xl">🎲</span>
                <p class="text-xs text-zinc-500 mt-1">Siap bertanding? Klik tombol di bawah untuk mengundi pasangan secara adil.</p>
            </div>
            <button onclick="generateMatch()" class="w-full bg-zinc-950 hover:bg-zinc-900 text-white font-bold py-3.5 px-4 rounded-xl text-sm transition-all active:scale-[0.98] shadow-md shadow-zinc-950/10 flex items-center justify-center gap-2">
                ⚡ KOCOR PERTANDINGAN
            </button>
        </div>

        <!-- AREA INPUT SKOR (Hanya Muncul Jika Klik Kocok) -->
        <div id="matchArea" class="hidden bg-white border-2 border-zinc-950 rounded-2xl p-4 shadow-lg space-y-4 animate-in fade-in slide-in-from-bottom-4 duration-300">
            <div class="flex items-center justify-between border-b border-zinc-100 pb-2">
                <h3 class="text-xs font-bold uppercase tracking-wider text-zinc-400">Pertandingan Berjalan</h3>
                <span class="bg-red-50 text-red-600 text-[10px] font-bold px-2 py-0.5 rounded-md border border-red-100">Live</span>
            </div>

            <!-- Tampilan Visual Tim vs Tim -->
            <div class="grid grid-cols-7 items-center gap-2 text-center text-xs font-bold">
                <div class="col-span-3 bg-zinc-50 border border-zinc-200 p-3 rounded-xl shadow-2xs text-zinc-900" id="teamANames">-</div>
                <div class="col-span-1 text-zinc-300 font-black text-sm italic">VS</div>
                <div class="col-span-3 bg-zinc-50 border border-zinc-200 p-3 rounded-xl shadow-2xs text-zinc-900" id="teamBNames">-</div>
            </div>

            <!-- Input Skor Dinamis -->
            <div class="bg-zinc-50 rounded-xl p-3 space-y-2.5 border border-zinc-100">
                <!-- Set 1 -->
                <div class="grid grid-cols-7 gap-2 items-center">
                    <div class="col-span-3 text-right"><input type="number" inputmode="numeric" id="scoreA1" class="w-16 px-2 py-2 text-center bg-white border border-zinc-300 rounded-lg text-sm font-extrabold focus:ring-2 focus:ring-zinc-900 focus:outline-none"></div>
                    <div class="col-span-1 text-center text-[11px] font-bold text-zinc-400">G1</div>
                    <div class="col-span-3 text-left"><input type="number" inputmode="numeric" id="scoreB1" class="w-16 px-2 py-2 text-center bg-white border border-zinc-300 rounded-lg text-sm font-extrabold focus:ring-2 focus:ring-zinc-900 focus:outline-none"></div>
                </div>
                <!-- Set 2 -->
                <div class="grid grid-cols-7 gap-2 items-center">
                    <div class="col-span-3 text-right"><input type="number" inputmode="numeric" id="scoreA2" class="w-16 px-2 py-2 text-center bg-white border border-zinc-300 rounded-lg text-sm font-extrabold focus:ring-2 focus:ring-zinc-900 focus:outline-none"></div>
                    <div class="col-span-1 text-center text-[11px] font-bold text-zinc-400">G2</div>
                    <div class="col-span-3 text-left"><input type="number" inputmode="numeric" id="scoreB2" class="w-16 px-2 py-2 text-center bg-white border border-zinc-300 rounded-lg text-sm font-extrabold focus:ring-2 focus:ring-zinc-900 focus:outline-none"></div>
                </div>
                <!-- Set 3 -->
                <div class="grid grid-cols-7 gap-2 items-center">
                    <div class="col-span-3 text-right"><input type="number" inputmode="numeric" id="scoreA3" placeholder="-" class="w-16 px-2 py-2 text-center bg-white border border-zinc-200 rounded-lg text-sm font-extrabold focus:ring-2 focus:ring-zinc-900 focus:outline-none"></div>
                    <div class="col-span-1 text-center text-[11px] font-bold text-zinc-400">G3</div>
                    <div class="col-span-3 text-left"><input type="number" inputmode="numeric" id="scoreB3" placeholder="-" class="w-16 px-2 py-2 text-center bg-white border border-zinc-200 rounded-lg text-sm font-extrabold focus:ring-2 focus:ring-zinc-900 focus:outline-none"></div>
                </div>
            </div>

            <button onclick="submitScore()" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 rounded-xl text-sm transition-all active:scale-[0.99] shadow-sm">
                💾 Simpan Hasil Pertandingan
            </button>
        </div>

        <!-- 2. TABEL KLASEMEN UTAMA -->
        <div class="bg-white border border-zinc-200/60 rounded-2xl p-4 shadow-xs space-y-3">
            <div class="flex items-center justify-between border-b border-zinc-100 pb-2">
                <h2 class="text-sm font-bold text-zinc-900 flex items-center gap-1.5">📊 Peringkat Perorangan</h2>
                <span class="text-[10px] text-zinc-400 font-medium">Auto-Sort BWF</span>
            </div>
            
            <div class="overflow-hidden rounded-xl border border-zinc-100">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead>
                            <tr class="bg-zinc-50 border-b border-zinc-200/80 font-bold text-zinc-500">
                                <th class="py-2.5 px-2 text-center w-8">#</th>
                                <th class="py-2.5 px-2">Nama</th>
                                <th class="py-2.5 px-1.5 text-center font-extrabold text-zinc-900">M</th>
                                <th class="py-2.5 px-1.5 text-center text-emerald-600">W</th>
                                <th class="py-2.5 px-1.5 text-center text-zinc-400">L</th>
                                <th class="py-2.5 px-1.5 text-center">+/-G</th>
                                <th class="py-2.5 px-2 text-center">+/-P</th>
                            </tr>
                        </thead>
                        <tbody id="standingsTableBody">
                            <!-- Injeksi Klasemen -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 3. ABSENSI & MANAJEMEN ANGGOTA -->
        <div class="bg-white border border-zinc-200/60 rounded-2xl p-4 shadow-xs space-y-4">
            <div>
                <h2 class="text-sm font-bold text-zinc-900">👥 Kehadiran & Anggota Klub</h2>
                <p class="text-[11px] text-zinc-400 mt-0.5">Centang yang hadir di lapangan hari ini.</p>
            </div>

            <!-- Form Tambah Cepat -->
            <div class="flex gap-2">
                <input id="playerNameInput" type="text" placeholder="Masukkan nama baru..." class="flex-1 px-3 py-2 bg-zinc-50 border border-zinc-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-zinc-900 text-xs">
                <button onclick="addPlayer()" class="bg-zinc-900 hover:bg-zinc-800 text-white px-4 py-2 rounded-xl font-bold text-xs transition active:scale-95 shadow-xs">＋</button>
            </div>

            <!-- Daftar Anggota Checklist A-Z -->
            <div id="playerCheckboxList" class="grid grid-cols-2 gap-2 max-h-48 overflow-y-auto pr-1 custom-scroll">
                <!-- Injeksi Absen -->
            </div>

            <div class="border-t border-zinc-100 pt-3 flex justify-between gap-4">
                <button onclick="resetStandings()" class="flex-1 bg-red-50 text-red-600 hover:bg-red-100/70 border border-red-200 py-2 rounded-xl font-bold text-[10px] tracking-wide text-center uppercase transition">
                    🔄 Reset Poin
                </button>
                <button onclick="clearAllPlayers()" class="flex-1 bg-zinc-50 text-zinc-500 hover:bg-zinc-100 border border-zinc-200 py-2 rounded-xl font-bold text-[10px] tracking-wide text-center uppercase transition">
                    ❌ Hapus Semua
                </button>
            </div>
        </div>

    </main>

    <!-- LOGIKA UTAMA -->
    <script>
