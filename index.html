<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badminton Standings Pro</title>
    <!-- Menggunakan Font Poppins -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        /* Gaya Dasar Aplikasi (Putih Abu-abu Minimalis) */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #f3f4f6;
            color: #111827;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        /* Memaksa Layout Berada di Tengah Seperti Aplikasi HP */
        .app-container {
            width: 100%;
            max-width: 450px;
            background-color: #fafafa;
            min-height: 100vh;
            border-left: 1px solid #e5e7eb;
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
        }
        header {
            background-color: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 16px;
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }
        header h1 {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: -0.025em;
        }
        header p {
            font-size: 10px;
            color: #6b7280;
            font-weight: 700;
            letter-spacing: 0.05em;
        }
        .badge {
            background-color: #111827;
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 9999px;
        }
        main {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        /* Gaya Kartu/Card UI */
        .card {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
        }
        .card-dashed {
            padding: 16px;
            background-color: #f9fafb;
            border: 1px dashed #d1d5db;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 12px;
        }
        .card-dashed p {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
        }
        /* Desain Tombol Yang Jelas */
        .btn-primary {
            width: 100%;
            background-color: #111827;
            color: #ffffff;
            font-weight: 700;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-primary:hover { background-color: #1f2937; }
        .btn-primary:active { transform: scale(0.98); }
        
        .btn-success {
            width: 100%;
            background-color: #047857;
            color: #ffffff;
            font-weight: 700;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            border: none;
            cursor: pointer;
            margin-top: 12px;
        }
        .btn-success:hover { background-color: #065f46; }
        
        /* Area Pertandingan Berjalan */
        .match-box {
            border: 2px solid #111827;
            border-radius: 16px;
            padding: 16px;
            background-color: #ffffff;
        }
        .match-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #f3f4f6;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .live-tag {
            background-color: #fee2e2;
            color: #dc2626;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid #fca5a5;
        }
        .vs-container {
            display: grid;
            grid-template-columns: 3fr 1fr 3fr;
            align-items: center;
            text-align: center;
            font-weight: 700;
            font-size: 13px;
            gap: 8px;
        }
        .team-box {
            background-color: #111827;
            color: #ffffff;
            padding: 12px;
            border-radius: 12px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Kolom Isian Skor Besar */
        .score-inputs {
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 12px;
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .score-row {
            display: grid;
            grid-template-columns: 3fr 1fr 3fr;
            align-items: center;
        }
        .input-skor {
            width: 70px;
            height: 44px;
            text-align: center;
            border: 2px solid #d1d5db;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 800;
        }
        .input-skor:focus {
            border-color: #111827;
            outline: none;
        }
        .set-label {
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            color: #9ca3af;
        }
        /* Tabel Klasemen Kompak */
        .section-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
            border-bottom: 1px solid #f3f4f6;
            padding-bottom: 6px;
        }
        .table-wrapper {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        th {
            background-color: #f3f4f6;
            color: #4b5563;
            font-weight: 700;
            padding: 10px 6px;
        }
        td {
            padding: 12px 6px;
            border-bottom: 1px solid #f3f4f6;
        }
        .text-center { text-align: center; }
        .font-bold { font-weight: 700; }
        
        /* Grid Absensi Anggota */
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .input-text {
            flex: 1;
            height: 42px;
            padding: 0 12px;
            border: 2px solid #d1d5db;
            border-radius: 12px;
            font-size: 13px;
        }
        .input-text:focus { border-color: #111827; outline: none; }
        .btn-add {
            background-color: #111827;
            color: #ffffff;
            border: none;
            width: 44px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
        }
        .checkbox-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            max-height: 180px;
            overflow-y: auto;
        }
        .check-label {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        .check-box { width: 16px; height: 16px; accent-color: #111827; }
        .footer-btns {
            display: flex;
            gap: 12px;
            margin-top: 14px;
            border-top: 1px solid #f3f4f6;
            padding-top: 12px;
        }
        .btn-sub {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            border: 1px solid #e5e7eb;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-reset { background-color: #fef2f2; color: #dc2626; border-color: #fca5a5; }
        .btn-clear { background-color: #f3f4f6; color: #4b5563; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div>
                <h1>🏸 MABAR KLASEMEN</h1>
                <p>GANDA PERORANGAN</p>
            </div>
            <span id="activeCountBadge" class="badge">0 Pemain</span>
        </header>

        <main>
            <!-- 1. Tombol Kocok -->
            <div class="card" style="text-align: center;">
                <div class="card-dashed">
                    <span style="font-size: 24px;">🎲</span>
                    <p>Siap bertanding? Klik tombol di bawah untuk mengundi pasangan secara adil.</p>
                </div>
                <button onclick="generateMatch()" class="btn-primary">⚡ KOCOK PERTANDINGAN</button>
            </div>

            <!-- Area Input Skor (Live Match) -->
            <div id="matchArea" class="match-box hidden">
                <div class="match-header">
                    <span style="font-size: 11px; font-weight:700; color:#9ca3af; text-transform: uppercase;">Pertandingan</span>
                    <span class="live-tag">LIVE MATCH</span>
                </div>
                <div class="vs-container">
                    <div class="team-box" id="teamANames">-</div>
                    <div style="color:#9ca3af; font-style:italic;">VS</div>
                    <div class="team-box" id="teamBNames">-</div>
                </div>
                <div class="score-inputs">
                    <div class="score-row">
                        <div style="text-align: right;"><input type="number" inputmode="numeric" id="scoreA1" class="input-skor"></div>
                        <div class="set-label">SET 1</div>
                        <div><input type="number" inputmode="numeric" id="scoreB1" class="input-skor"></div>
                    </div>
                    <div class="score-row">
                        <div style="text-align: right;"><input type="number" inputmode="numeric" id="scoreA2" class="input-skor"></div>
                        <div class="set-label">SET 2</div>
                        <div><input type="number" inputmode="numeric" id="scoreB2" class="input-skor"></div>
                    </div>
                    <div class="score-row">
                        <div style="text-align: right;"><input type="number" inputmode="numeric" id="scoreA3" placeholder="-" class="input-skor"></div>
                        <div class="set-label">SET 3</div>
                        <div><input type="number" inputmode="numeric" id="scoreB3" placeholder="-" class="input-skor"></div>
                    </div>
                </div>
                <button onclick="submitScore()" class="btn-success">💾 Simpan Hasil Pertandingan</button>
            </div>

            <div class="card">
                <h2 class="section-title">📊 Peringkat Perorangan</h2>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 35px; text-align:center;">#</th>
                                <th style="text-align: left; padding-left:8px;">Nama</th>
                                <th style="text-align: center; color:#111827">M</th>
                                <th style="text-align: center; color:#047857">W</th>
                                <th style="text-align: center; color:#dc2626">L</th>
                                <th style="text-align: center;">+/-G</th>
                                <th style="text-align: center; padding-right:6px;">+/-P</th>
                            </tr>
                        </thead>
                        <tbody id="standingsTableBody">
                            <!-- Diisi Otomatis via JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <h2 class="section-title">👥 Kehadiran & Anggota Klub</h2>
                <div class="input-group">
                    <input id="playerNameInput" type="text" placeholder="Masukkan nama baru..." class="input-text">
                    <button onclick="addPlayer()" class="btn-add">＋</button>
                </div>
                <div id="playerCheckboxList" class="checkbox-grid">
                </div>
                <div class="footer-btns">
                    <button onclick="resetStandings()" class="btn-sub btn-reset">🔄 Reset Poin</button>
                    <button onclick="clearAllPlayers()" class="btn-sub btn-clear">❌ Hapus Semua</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        let players = JSON.parse(localStorage.getItem('badminton_players')) || [];
        let currentMatch = null;

        updateUI();

        function addPlayer() {
            const nameInput = document.getElementById('playerNameInput');
            const name = nameInput.value.trim();
            if (!name) return;
            if (players.some(p => p.name.toLowerCase() === name.toLowerCase())) return alert('Pemain sudah terdaftar!');

            players.push({
                name: name, checked: true,
                played: 0, won: 0, lost: 0, gameDiff: 0, pointDiff: 0
            });
            nameInput.value = '';
            saveAndRefresh();
        }

        function togglePlayerCheck(index) {
            players[index].checked = !players[index].checked;
            saveAndRefresh();
        }

        function saveAndRefresh() {
            localStorage.setItem('badminton_players', JSON.stringify(players));
            updateUI();
        }

        function updateUI() {
            // 1. RENDERING CHECKLIST ABSENSI (A-Z)
            const sortedForAbsen = [...players].map((p, idx) => ({...p, idx})).sort((a, b) => a.name.localeCompare(b.name));
            const checkboxList = document.getElementById('playerCheckboxList');
            checkboxList.innerHTML = '';
            let activeCount = 0;

            sortedForAbsen.forEach(p => {
                if (p.checked) activeCount++;
                checkboxList.innerHTML += `
                    <label class="check-label">
                        <input type="checkbox" ${p.checked ? 'checked' : ''} onchange="togglePlayerCheck(${p.idx})" class="check-box">
                        <span style="${p.checked ? '' : 'color: #9ca3af; text-decoration: line-through;'} text-overflow: ellipsis; white-space: nowrap; overflow: hidden;">${p.name}</span>
                    </label>
                `;
            });
            document.getElementById('activeCountBadge').innerText = `${activeCount} Pemain`;

            // 2. RENDERING TABEL KLASEMEN (URUT STANDAR BWF)
            const sortedForStandings = [...players].sort((a, b) => {
                if (b.won !== a.won) return b.won - a.won;
                if (b.gameDiff !== a.gameDiff) return b.gameDiff - a.gameDiff;
                return b.pointDiff - a.pointDiff;
            });

            const standingsBody = document.getElementById('standingsTableBody');
            standingsBody.innerHTML = '';

            if (sortedForStandings.length === 0) {
                standingsBody.innerHTML = `<tr><td colspan="7" class="text-center" style="padding: 24px; color: #9ca3af; font-style: italic;">Belum ada data anggota.</td></tr>`;
            } else {
                sortedForStandings.forEach((player, index) => {
                    let rowStyle = '';
                    let rankText = index + 1;
                    
                    if (index === 0) {
                        rowStyle = 'background-color: #111827; color: #ffffff; font-weight: 700;';
                        rankText = '🥇';
                    } else {
                        rowStyle = index % 2 === 0 ? 'background-color: #f9fafb;' : 'background-color: #ffffff;';
                        if (index === 1) rankText = '🥈';
                        if (index === 2) rankText = '🥉';
                    }

                    const gameSign = player.gameDiff > 0 ? '+' : '';
                    const pointSign = player.pointDiff > 0 ? '+' : '';
                    
                    let gameColor = player.gameDiff >= 0 ? 'color: #047857;' : 'color: #dc2626;';
                    let pointColor = player.pointDiff >= 0 ? 'color: #047857;' : 'color: #dc2626;';
                    
                    if (index === 0) { 
                        gameColor = 'color: #34d399;'; 
                        pointColor = 'color: #34d399;'; 
                    }

                    standingsBody.innerHTML += `
                        <tr style="${rowStyle}">
                            <td class="text-center font-bold" style="padding: 12px 6px;">${rankText}</td>
                            <td style="padding-left: 8px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; max-width: 110px;">${player.name}</td>
                            <td class="text-center font-bold">${player.played}</td>
                            <td class="text-center font-bold" style="${index === 0 ? 'color: #34d399;' : 'color: #047857;'}">${player.won}</td>
                            <td class="text-center" style="${index === 0 ? 'color: #f87171;' : 'color: #9ca3af;'}">${player.lost}</td>
                            <td class="text-center font-bold" style="${gameColor}">${gameSign}${player.gameDiff}</td>
                            <td class="text-center font-bold" style="${pointColor} padding-right:6px;">${pointSign}${player.pointDiff}</td>
                        </tr>
                    `;
                });
            }
        }

        function generateMatch() {
            const activePlayers = players.filter(p => p.checked);
            if (activePlayers.length < 4) return alert('Butuh minimal 4 orang pemain yang aktif/hadir!');

            const shuffled = [...activePlayers].sort(() => 0.5 - Math.random());
            currentMatch = {
