<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badminton Standings Pro</title>
    <!-- Menggunakan Font Poppins -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        /* Gaya Dasar Aplikasi (Putih Abu-abu Minimalis) */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #f3f4f6;
            color: #111827;
            display: flex;
            justify-content: center;
            min-h: 100vh;
        }
        /* Memaksa Layout Berada di Tengah Seperti Aplikasi HP */
        .app-container {
            width: 100%;
            max-width: 450px;
            background-color: #fafafa;
            min-height: 100vh;
            border-left: 1px solid #e5e7eb;
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
        }
        header {
            background-color: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 16px;
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }
        header h1 {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: -0.025em;
        }
        header p {
            font-size: 10px;
            color: #6b7280;
            font-weight: 700;
            letter-spacing: 0.05em;
        }
        .badge {
            background-color: #111827;
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 9999px;
        }
        main {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        /* Gaya Kartu/Card UI */
        .card {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
        }
        .card-dashed {
            padding: 16px;
            background-color: #f9fafb;
            border: 1px dashed #d1d5db;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 12px;
        }
        .card-dashed p {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
        }
        /* Desain Tombol Yang Jelas */
        .btn-primary {
            width: 100%;
            background-color: #111827;
            color: #ffffff;
            font-weight: 700;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-primary:hover { background-color: #1f2937; }
        .btn-primary:active { transform: scale(0.98); }
        
        .btn-success {
            width: 100%;
            background-color: #047857;
            color: #ffffff;
            font-weight: 700;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            border: none;
            cursor: pointer;
            margin-top: 12px;
        }
        .btn-success:hover { background-color: #065f46; }
        
        /* Area Pertandingan Berjalan */
        .match-box {
            border: 2px solid #111827;
            border-radius: 16px;
            padding: 16px;
            background-color: #ffffff;
        }
        .match-header {
            display: flex;
            justify-content: space-between;
            border-b: 1px solid #f3f4f6;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .live-tag {
            background-color: #fee2e2;
            color: #dc2626;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid #fca5a5;
        }
        .vs-container {
            display: grid;
            grid-template-columns: 3fr 1fr 3fr;
            align-items: center;
            text-align: center;
            font-weight: 700;
            font-size: 13px;
            gap: 8px;
        }
        .team-box {
            background-color: #111827;
            color: #ffffff;
            padding: 12px;
            border-radius: 12px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Kolom Isian Skor Besar */
        .score-inputs {
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 12px;
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .score-row {
            display: grid;
            grid-template-columns: 3fr 1fr 3fr;
            align-items: center;
        }
        .input-skor {
            width: 70px;
            height: 44px;
            text-align: center;
            border: 2px solid #d1d5db;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 800;
        }
        .input-skor:focus {
            border-color: #111827;
            outline: none;
        }
        .set-label {
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            color: #9ca3af;
        }
        /* Tabel Klasemen Kompak */
        .section-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
            border-bottom: 1px solid #f3f4f6;
            padding-bottom: 6px;
        }
        .table-wrapper {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        th {
            background-color: #f3f4f6;
            color: #4b5563;
            font-weight: 700;
            padding: 10px 6px;
        }
        td {
            padding: 12px 6px;
            border-bottom: 1px solid #f3f4f6;
        }
        .row-leader { background-color: #111827 !0; color: #ffffff !important; font-weight: 700; }
        .row-even { background-color: #f9fafb; }
        .row-odd { background-color: #ffffff; }
        .text-center { text-align: center; }
        .font-bold { font-weight: 700; }
        /* Grid Absensi Anggota */
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .input-text {
            flex: 1;
            height: 42px;
            padding: 0 12px;
            border: 2px solid #d1d5db;
            border-radius: 12px;
            font-size: 13px;
        }
        .input-text:focus { border-color: #111827; outline: none; }
        .btn-add {
            background-color: #111827;
            color: #ffffff;
            border: none;
            width: 44px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
        }
        .checkbox-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            max-height: 180px;
            overflow-y: auto;
        }
        .check-label {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        .check-box { width: 16px; height: 16px; accent-color: #111827; }
        .footer-btns {
            display: flex;
            gap: 12px;
            margin-top: 14px;
            border-top: 1px solid #f3f4f6;
            padding-top: 12px;
        }
        .btn-sub {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            border: 1px solid #e5e7eb;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-reset { background-color: #fef2f2; color: #dc2626; border-color: #fca5a5; }
        .btn-clear { background-color: #f3f4f6; color: #4b5563; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div>
                <h1>🏸 URBAN BADMINTON KLASEMEN</h1>
                <p>GANDA PERORANGAN</p>
            </div>
            <span id="activeCountBadge" class="badge">0 Pemain</span>
        </header>

        <main>
            <!-- 1. Tombol Kocok -->
            <div class="card" style="text-align: center;">
                <div class="card-dashed">
                    <span style="font-size: 24px;">🎲</span>
                    <p>Siap bertanding? Klik tombol di bawah untuk mengundi pasangan secara adil.</p>
                </div>
                <button onclick="generateMatch()" class="btn-primary">⚡ KOCOK PERTANDINGAN</button>
            </div>

            <!-- Area Input Skor (Live Match) -->
            <div id="matchArea" class="match-box hidden">
                <div class="match-header">
